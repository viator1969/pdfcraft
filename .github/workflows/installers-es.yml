# Personal test build (fork only, not for upstream): unsigned macOS and Windows installers of this
# branch, which carries the Spanish interface catalog. Download them from the run's Artifacts.
name: Installers (es, unsigned)

on:
  push:
    branches: [installers-es]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PDFCRAFT_BUILD_SHA: ${{ github.sha }}

jobs:
  macos:
    name: macOS universal (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out craft-fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: installers-es-macos
      - name: Build and package (ad-hoc signed, not notarized)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-es-macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows x64 (.msi + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out craft-fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: installers-es-windows-x64
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build and package (unsigned)
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-es-windows-x64
          path: dist/release/*
          if-no-files-found: error
